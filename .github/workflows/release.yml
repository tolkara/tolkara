# On a v* release: Tolkara Management (the Mac setup app), the unsigned .ipa and the notes.

name: Release

on:
  release:
    types: [published]
  push:
    tags: ["v*"] # only v* tags
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build the unsigned .ipa for"
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # create or edit the release, upload the .ipa

env:
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
  IPA: Tolkara-unsigned.ipa
  DMG: Tolkara-Management.dmg
  MARKER: "<!-- generated by .github/workflows/release.yml -->"

jobs:
  ipa:
    name: Unsigned .ipa
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          # Full history: the notes list commits since the previous tag.
          fetch-depth: 0

      - name: Decide whether there is anything to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Finished by the other event's run; by hand always rebuilds.
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          body=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if printf '%s' "$body" | grep -qF "$MARKER" && printf '%s\n' "$assets" | grep -qx "$IPA"; then
            echo "$TAG already carries its notes and $IPA."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        if: steps.plan.outputs.skip != 'true'
        run: brew install xcodegen

      - name: Build the unsigned .ipa
        if: steps.plan.outputs.skip != 'true'
        # Published, so nothing exported from the runner's macOS goes in.
        run: TOLKARA_SYSTEM_ROOTS=NO tools/package_ipa.sh "$IPA"

      - name: Write the release notes
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start from the release's description, or the tag's message.
          if ! gh release view "$TAG" --json body --jq .body > body.md 2>/dev/null; then
            if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = tag ]; then
              git tag -l --format='%(contents)' "$TAG" > body.md
            else
              : > body.md
            fi
          fi
          # Above the marker is kept, below is ours; normalise CRLF.
          tr -d '\r' < body.md \
            | awk -v marker="$MARKER" 'index($0, marker) { exit } { print }' \
            | awk 'NF { last = NR } { line[NR] = $0 } END { for (i = 1; i <= last; i++) print line[i] }' \
            > notes.md

          # The previous tag: "$TAG^" keeps it off its own list.
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          URL=${{ github.server_url }}/${{ github.repository }}
          git log --no-merges --format="- [\`%h\`]($URL/commit/%H) %s" "${PREV:+$PREV..}$TAG" > commits.md
          TOTAL=$(wc -l < commits.md | tr -d ' ')

          {
            if [ -s notes.md ]; then echo; fi
            echo "$MARKER"
            echo "---"
            echo
            echo "**\`$DMG\` — the easy way.** Tolkara Management is a Mac app that checks your setup step by step, builds Tolkara on your Mac with your own Apple developer account, installs it on your iPad and copies your game, such as World of Warcraft Forever. It needs a paid Apple Developer Program membership, Xcode and your own copy of the game. Open the disk image and drag the app to Applications. If macOS says it cannot check the app, open System Settings › Privacy & Security and click Open Anyway. The app carries only Tolkara's own code and source; see [its guide]($URL/blob/$TAG/docs/MANAGEMENT.md)."
            echo
            echo "\`$IPA\` is an unsigned build: your sideloading app signs it with your own Apple ID. It is meant for External JIT mode and is a convenience; the supported way to use Tolkara is to [build it yourself]($URL/blob/$TAG/docs/BUILDING.md). What it can and cannot do is in the [README]($URL#readme)."
            echo
            echo "**Install on your iPad** — copy the line for your sideloading app into Safari. GitHub drops links that are not https, so these are text to copy, not links:"
            echo
            echo "- SideStore: \`sidestore://install?url=$URL/releases/download/$TAG/$IPA\`"
            echo "- LiveContainer: \`livecontainer://install?url=$URL/releases/download/$TAG/$IPA\`"
            echo
            if [ -n "$PREV" ]; then
              echo "**Commits since $PREV:**"
            else
              echo "**Commits** (first release):"
            fi
            echo
            # A release description holds 125,000 characters; keep well inside it.
            head -n 200 commits.md
            if [ "$TOTAL" -gt 200 ]; then
              echo "- … and $((TOTAL - 200)) more"
            fi
            if [ -n "$PREV" ]; then
              echo
              echo "[Full diff]($URL/compare/$PREV...$TAG)"
            fi
          } >> notes.md

      - name: Publish
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" "$IPA" --clobber

      - name: Keep the build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  management:
    name: Tolkara Management
    # After the .ipa job, which creates the release and writes its notes.
    needs: ipa
    runs-on: macos-26
    env:
      # A step's own env is not visible to its `if`; secrets are not usable there at all.
      HAS_DEVELOPER_ID: ${{ secrets.MANAGEMENT_DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          # The app embeds the tagged source (git archive) and names its tag.
          fetch-depth: 0

      - name: Decide whether there is anything to do
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != workflow_dispatch ] &&
             gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$DMG"; then
            echo "$TAG already carries $DMG."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        if: steps.plan.outputs.skip != 'true'
        run: brew install xcodegen

      - name: Import the Developer ID certificate
        # Optional: without these secrets the app is ad hoc signed and not notarized.
        if: steps.plan.outputs.skip != 'true' && env.HAS_DEVELOPER_ID == 'true'
        env:
          P12: ${{ secrets.MANAGEMENT_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MANAGEMENT_DEVELOPER_ID_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASSWORD=$(uuidgen)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity in the certificate."; exit 1; }
          echo "MANAGEMENT_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY_P8" ]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi

      - name: Build the disk image
        if: steps.plan.outputs.skip != 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: TOLKARA_VERSION="${TAG#v}" tools/package_management.sh "$DMG"

      - name: Publish
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$DMG" --clobber

      - name: Remove the signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Keep the build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: management-build-log
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
