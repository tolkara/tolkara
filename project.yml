name: Tolkara
options:
  bundleIdPrefix: local.tolkara
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    # Signing identity and identifiers come from your ignored local.env through
    # tools/generate.sh. Nothing personal is committed. See docs/BUILDING.md.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    TOLKARA_BUNDLE_ID: ${TOLKARA_BUNDLE_ID}
    TOLKARA_KEYCHAIN_GROUP: ${TOLKARA_KEYCHAIN_GROUP}
    # The App Group a second build of Tolkara shares with the first (a separate app
    # for one Windows process, docs/MULTIPROCESS.md): named after the first app's ID.
    TOLKARA_GROUP_BASE: ${TOLKARA_GROUP_BASE}
    # Optional execution-mode preselection (developer-service or local-signing;
    # tools/package_ipa.sh passes external-jit), read once into Info.plist.
    # Empty: the app asks on first launch.
    TOLKARA_MODE: ${TOLKARA_MODE}
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_OBJC_ARC: YES
    GUEST_RUNTIME: emulated
    HEADER_SEARCH_PATHS: "$(SRCROOT)/runtime $(SRCROOT)/translation/Metal"
schemes:
  Tolkara:
    build:
      targets:
        Tolkara: all
    run:
      config: Debug
      executable: Tolkara
      # Guest execution must not keep Xcode's debugger attached.
      debugEnabled: false
    management:
      shared: true
      isShown: true
      orderHint: 0
  # Side-by-side scheduling test of the two probe apps, driven by XCUITest.
  ProcessProbeUITests:
    build:
      targets:
        ProcessProbe: all
        ProcessProbePeer: all
        ProcessProbeUITests: [test]
    test:
      config: Debug
      targets: [ProcessProbeUITests]
targetTemplates:
  AppBase:
    type: application
    platform: iOS
    sources:
      - path: launcher
        excludes: [Info.plist]
      - path: runtime
      # The shader-container rewrap, for the Diagnostics menu's captured-shader check.
      - path: translation/Metal/LibraryContainer.m
    dependencies:
      - sdk: Security.framework
      - sdk: libz.tbd
      # The Diagnostics menu's controller check and --trace-controllers read
      # the framework a guest's gamepad code uses (launcher/App/ControllerProbe.m).
      - sdk: GameController.framework
    entitlements:
      path: launcher/App.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: launcher/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    postBuildScripts:
      - name: Package guest runtime
        basedOnDependencyAnalysis: false
        script: |
          set -e
          if [ "$GUEST_RUNTIME" != emulated ]; then echo "error: unknown GUEST_RUNTIME: $GUEST_RUNTIME"; exit 1; fi
          "$SRCROOT/tools/build_emulated_guest.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" "$GUEST_EXE"
targets:
  TolkaraDiagnostics:
    templates: [AppBase]
  Tolkara:
    templates: [AppBase]
    sources: [authorization/App, authorization/Diagnostics, authorization/Control, authorization/Storage, authorization/Pairing/PairingWire.swift, authorization/Pairing/PairingIdentity.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID)
        # A direct Xcode build gets the generic compatibility libraries;
        # tools/install.sh passes its own choice. TolkaraDiagnostics, used by
        # tools/run.sh, keeps none unless one is passed.
        NATIVE_GUEST_SHIMS: GENERIC
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) TOLKARA_INTEGRATED_AUTH=1"
        INFOPLIST_FILE: authorization/App/Integrated-Info.plist
        SWIFT_VERSION: "5.0"
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/authorization $(SRCROOT)/authorization/App"
    entitlements:
      path: authorization/App/Integrated.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(TOLKARA_KEYCHAIN_GROUP)"]
        com.apple.security.application-groups: ["group.$(TOLKARA_GROUP_BASE).shared"]
    dependencies:
      - sdk: NetworkExtension.framework
      - target: LocalAuthorizationTunnel
        embed: true
  LocalAuthorizationTunnel:
    type: app-extension
    platform: iOS
    sources: [authorization/Tunnel, authorization/Diagnostics, authorization/Control, authorization/LocalRoute.c, authorization/DebugWire.c, authorization/Pairing, authorization/Transport, authorization/Storage, authorization/Debugger]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID).authorization
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: authorization/Tunnel/Info.plist
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/authorization"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
        # The helper processes every byte of the local TCP/TLS and RSP streams.
        # Keep this path optimized even in a development-signed diagnostic app.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_COMPILATION_MODE: wholemodule
        GCC_OPTIMIZATION_LEVEL: "2"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/authorization/Transport/TransportBridge.h"
    entitlements:
      path: authorization/Tunnel/LocalTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        keychain-access-groups: ["$(AppIdentifierPrefix)$(TOLKARA_KEYCHAIN_GROUP)"]
    dependencies:
      - sdk: NetworkExtension.framework

  StorageProbe:
    type: application
    platform: iOS
    sources: [tools/StorageProbe, authorization/Storage, authorization/Pairing/PairingWire.swift, authorization/Pairing/PairingIdentity.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID).storageprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: tools/StorageProbe/Info.plist
        STORAGE_PROBE_GROUP: "$(AppIdentifierPrefix)$(TOLKARA_KEYCHAIN_GROUP).probe"
        SWIFT_VERSION: "5.0"
    entitlements:
      path: tools/StorageProbe/Probe.entitlements
      properties:
        keychain-access-groups: ["$(STORAGE_PROBE_GROUP)"]
    dependencies:
      - sdk: Security.framework

  # ProcessProbe: separate worker processes through app-defined extension points
  # (ExtensionFoundation, iOS 26), each reporting its own limits (docs/MULTIPROCESS.md).
  ProcessProbe:
    type: application
    platform: iOS
    deploymentTarget: "26.2"
    sources: [tools/ProcessProbe/Host, tools/ProcessProbe/Shared]
    info:
      path: tools/ProcessProbe/Host/Info.plist
      properties:
        ProbeAppGroup: group.$(TOLKARA_BUNDLE_ID).processprobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID).processprobe
        SWIFT_OBJC_BRIDGING_HEADER: tools/ProcessProbe/Shared/ProbeShm.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        EX_ENABLE_EXTENSION_POINT_GENERATION: YES
        SWIFT_VERSION: "5.0"
    entitlements:
      path: tools/ProcessProbe/Probe.entitlements
      properties:
        com.apple.developer.kernel.extended-virtual-addressing: true
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.security.application-groups: [group.$(TOLKARA_BUNDLE_ID).processprobe]
    dependencies:
      - target: ProcessProbeWorkerA
        embed: true
      - target: ProcessProbeWorkerB
        embed: true
  ProcessProbeWorkerA:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.2"
    sources: [tools/ProcessProbe/Worker, tools/ProcessProbe/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID).processprobe.workera
        SWIFT_OBJC_BRIDGING_HEADER: tools/ProcessProbe/Shared/ProbeShm.h
        PROCESS_PROBE_HOST_ID: $(TOLKARA_BUNDLE_ID).processprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: tools/ProcessProbe/Worker/Info.plist
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
    # Apple does not grant extended addressing or the increased memory limit to app
    # extensions ("could not be included in profile"); the debugging memory limit
    # also makes XNU give a process the jumbo address space.
    entitlements:
      path: tools/ProcessProbe/Worker/Worker.entitlements
      properties:
        com.apple.developer.kernel.increased-debugging-memory-limit: true
  ProcessProbeWorkerB:
    type: extensionkit-extension
    platform: iOS
    deploymentTarget: "26.2"
    sources: [tools/ProcessProbe/Worker, tools/ProcessProbe/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID).processprobe.workerb
        SWIFT_OBJC_BRIDGING_HEADER: tools/ProcessProbe/Shared/ProbeShm.h
        PROCESS_PROBE_HOST_ID: $(TOLKARA_BUNDLE_ID).processprobe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: tools/ProcessProbe/Worker/Info.plist
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
    # Apple does not grant extended addressing or the increased memory limit to app
    # extensions ("could not be included in profile"); the debugging memory limit
    # also makes XNU give a process the jumbo address space.
    entitlements:
      path: tools/ProcessProbe/Worker/Worker.entitlements
      properties:
        com.apple.developer.kernel.increased-debugging-memory-limit: true
  # ProcessProbePeer: a second app of the same team, for what a separate app process
  # adds over an extension (its own app limits) and how the two apps talk.
  ProcessProbePeer:
    type: application
    platform: iOS
    deploymentTarget: "26.2"
    sources: [tools/ProcessProbe/Peer, tools/ProcessProbe/Shared]
    info:
      path: tools/ProcessProbe/Peer/Info.plist
      properties:
        ProbeAppGroup: group.$(TOLKARA_BUNDLE_ID).processprobe
        BGTaskSchedulerPermittedIdentifiers: [$(TOLKARA_BUNDLE_ID).processprobe.peer.validation]
        UIBackgroundModes: [processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID).processprobe.peer
        SWIFT_OBJC_BRIDGING_HEADER: tools/ProcessProbe/Shared/ProbeShm.h
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
    entitlements:
      path: tools/ProcessProbe/Peer/Peer.entitlements
      properties:
        com.apple.developer.kernel.extended-virtual-addressing: true
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.security.application-groups: [group.$(TOLKARA_BUNDLE_ID).processprobe]
  # Drives the two probe apps on the device (side-by-side scheduling test).
  ProcessProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.2"
    sources: [tools/ProcessProbe/UITests]
    info:
      path: tools/ProcessProbe/UITests/Info.plist
      properties:
        ProbeHostID: $(TOLKARA_BUNDLE_ID).processprobe
        ProbePeerID: $(TOLKARA_BUNDLE_ID).processprobe.peer
        TolkaraFirstID: $(TOLKARA_BUNDLE_ID)
        TolkaraSecondID: $(TOLKARA_BUNDLE_ID).browser
        TwoAppProfile: $(TWO_APP_PROFILE)
        TwoAppFirstEnv: $(TWO_APP_FIRST_ENV)
        TwoAppSecondEnv: $(TWO_APP_SECOND_ENV)
        TwoAppSecondWait: $(TWO_APP_SECOND_WAIT)
        TwoAppMinutes: $(TWO_APP_MINUTES)
        TwoAppFirstArguments: $(TWO_APP_FIRST_ARGUMENTS)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TOLKARA_BUNDLE_ID).processprobe.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: ProcessProbe
    dependencies:
      - target: ProcessProbe
